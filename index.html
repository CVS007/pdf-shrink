<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1c1e">
<title>PDF Shrink</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root {
    --bg: #1c1c1e; --panel: #2c2c2e; --line: #3a3a3c;
    --text: #f2f2f7; --muted: #9a9aa0; --accent: #ffc400; --ok: #30d158; --err: #ff453a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 1rem; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, sans-serif;
    max-width: 34rem; margin-inline: auto;
    padding-bottom: max(1rem, env(safe-area-inset-bottom));
  }
  h1 { font-size: 1.3rem; margin: .25rem 0 1rem; letter-spacing: -.01em; }
  h1 span { color: var(--accent); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: .9rem; padding: 1rem; margin-bottom: .85rem; }
  label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: .4rem; }
  input[type=file], input[type=number] {
    width: 100%; padding: .8rem; background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: .6rem; font-size: 1rem;
  }
  .row { display: flex; gap: .6rem; }
  .row > * { flex: 1; }
  button {
    width: 100%; padding: .95rem; font-size: 1rem; font-weight: 600;
    border: 0; border-radius: .6rem; background: var(--accent); color: #1c1c1e;
    cursor: pointer; touch-action: manipulation;
  }
  button.secondary { background: var(--line); color: var(--text); }
  button:disabled { opacity: .45; cursor: default; }
  #log {
    font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--muted); white-space: pre-wrap; word-break: break-word;
    max-height: 12rem; overflow-y: auto; margin: 0;
  }
  .dl {
    display: block; margin-top: .6rem; padding: .95rem; text-align: center;
    background: var(--line); color: var(--text); border-radius: .6rem;
    font-weight: 600; text-decoration: none;
  }
  .hide { display: none; }
  .big { font-size: 1.5rem; font-weight: 700; color: var(--ok); }
  .err { color: var(--err); }
  .note { font-size: .8rem; color: var(--muted); margin: .5rem 0 0; }
</style>
</head>
<body>

<h1>PDF <span>Shrink</span></h1>

<div class="card">
  <label for="file">PDF to compress</label>
  <input type="file" id="file" accept="application/pdf,.pdf">
  <p class="note" id="filenote">Runs entirely on this device. Nothing is uploaded.</p>
</div>

<div class="card">
  <label for="target">Target size (MB) — portals count decimal MB</label>
  <input type="number" id="target" value="4.6" min="0.1" step="0.1" inputmode="decimal">
</div>

<button id="go" disabled>Compress</button>

<div class="card hide" id="progress" style="margin-top:.85rem">
  <pre id="log"></pre>
</div>

<div class="card hide" id="result">
  <div class="big" id="size"></div>
  <p class="note" id="detail"></p>
  <button id="share" style="margin-top:.8rem">Share to WhatsApp / email</button>
  <a id="dl" class="dl" download>Download</a>
</div>

<script src="vendor/pdf-lib.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
